[project]
name = "swda-part1c"
version = "1.0.0"
description = "Synthetic governed MCP recommendation demonstration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0", "pydantic==2.14.3", "pytest==9.2.0", "ruff==0.17.4",
    # 50.x has no macOS Intel wheels; keep setup compiler-free on both Mac architectures.
    "cryptography==48.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
