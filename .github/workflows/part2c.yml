name: Part2C simulation verification
on:
  pull_request:
    paths: ["Part2C/**", "Part2A/**", ".github/workflows/part2c.yml"]
  push:
    branches: [main]
    paths: ["Part2C/**", "Part2A/**", ".github/workflows/part2c.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./Part2C/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part2c-results
          path: Part2C/runtime/
